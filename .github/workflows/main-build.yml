name: Main Build

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/pr-build.yml"
      - ".github/workflows/main-build.yml"
      - "buildroot-version.txt"
      - "external/**"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: main-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-image:
    name: Build boot and test artifacts
    runs-on: ubuntu-latest
    # WPEWebKit builds from source; 120m was enough for the Phase 1
    # console-only image but is not enough headroom for that. Revisit
    # once we have real timing data from a successful run.
    timeout-minutes: 300

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Test mode-resolve logic
        run: ./scripts/test-mode-resolve.sh

      - name: Test browser-supervise logic
        run: ./scripts/test-browser-supervise.sh

      - name: Read Buildroot version
        id: buildroot
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < buildroot-version.txt)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Buildroot downloads
        uses: actions/cache@v5
        with:
          path: |
            dl
            .build/buildroot-${{ steps.buildroot.outputs.version }}.tar.xz
          key: ${{ runner.os }}-buildroot-${{ steps.buildroot.outputs.version }}-${{ hashFiles('buildroot-version.txt', 'external/configs/talaria_display_x86_64_defconfig') }}
          restore-keys: |
            ${{ runner.os }}-buildroot-${{ steps.buildroot.outputs.version }}-
            ${{ runner.os }}-buildroot-

      - name: Cache Buildroot host toolchain
        uses: actions/cache@v5
        with:
          path: |
            output/host
            output/build/host-*
            output/build/toolchain-*
            output/build/linux-headers-*
          key: ${{ runner.os }}-buildroot-host-${{ steps.buildroot.outputs.version }}-${{ hashFiles('buildroot-version.txt', 'external/**', 'scripts/build.sh', 'scripts/save-defconfig.sh') }}
          restore-keys: |
            ${{ runner.os }}-buildroot-host-${{ steps.buildroot.outputs.version }}-

      - name: Install host dependencies
        run: ./scripts/ci-install-deps.sh

      - name: Bootstrap Buildroot
        run: ./scripts/bootstrap-buildroot.sh

      - name: Build image
        run: ./scripts/build.sh

      - name: Package boot and test artifacts
        run: ./scripts/package-artifacts.sh

      - name: QEMU smoke test
        run: ./scripts/qemu-smoke-test.sh

      - name: Upload image artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: talaria-display-os-main-${{ github.run_number }}
          path: |
            artifacts/talaria-display-os-*.tar.gz
            artifacts/qemu-smoke.log
          compression-level: 0
          retention-days: 30
          if-no-files-found: error

      - name: Compute release metadata
        id: meta
        shell: bash
        run: |
          short_sha="$(git rev-parse --short HEAD)"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"
          echo "tag=main-${{ github.run_number }}-$short_sha" >> "$GITHUB_OUTPUT"

      # Only reached if the QEMU smoke test above passed - a build that
      # doesn't boot doesn't get a release, on top of the 30-day
      # artifact above. Prerelease: these are automatic per-build dev
      # snapshots, not curated version bumps, so they shouldn't claim
      # GitHub's "Latest" badge or imply more stability than exists.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.meta.outputs.tag }}" \
            artifacts/talaria-display-os-*.tar.gz \
            artifacts/qemu-smoke.log \
            --title "Main build #${{ github.run_number }} (${{ steps.meta.outputs.short_sha }})" \
            --notes "Automatic build from a Main Build CI run that passed the QEMU boot smoke test.

          This is a development snapshot, not a curated release. See the attached manifest/checksums inside the tarball for exact package provenance. The WPE/Cog browser stack is still best-effort/unverified Kconfig — check the build log for this run to see whether it actually built successfully, don't assume it from the release existing." \
            --prerelease
