name: PR Build

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/pr-build.yml"
      - ".github/workflows/main-build.yml"
      - "buildroot-version.txt"
      - "external/**"
      - "scripts/**"
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-image:
    name: Build bootable image
    runs-on: ubuntu-latest
    # WPEWebKit builds from source; 120m was enough for the Phase 1
    # console-only image but is not enough headroom for that. Revisit
    # once we have real timing data from a successful run.
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Test mode-resolve logic
        run: ./scripts/test-mode-resolve.sh

      - name: Test pairing page generation
        run: ./scripts/test-pairing-url.sh

      - name: Test browser-supervise logic
        run: ./scripts/test-browser-supervise.sh

      - name: Test browser init lifecycle
        run: ./scripts/test-browser-init.sh

      - name: Read Buildroot version
        id: buildroot
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < buildroot-version.txt)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Buildroot downloads
        uses: actions/cache@v5
        with:
          path: |
            dl
            .build/buildroot-${{ steps.buildroot.outputs.version }}.tar.xz
          key: ${{ runner.os }}-buildroot-${{ steps.buildroot.outputs.version }}-${{ hashFiles('buildroot-version.txt', 'external/configs/talaria_display_x86_64_defconfig') }}
          restore-keys: |
            ${{ runner.os }}-buildroot-${{ steps.buildroot.outputs.version }}-
            ${{ runner.os }}-buildroot-

      # Covers host toolchain AND target package build state (including
      # output/build/wpewebkit-*, by far the slowest thing this repo
      # builds at ~3+ hours from cold). Keyed by run_id so every run
      # saves a fresh cache entry rather than trying to exact-match a
      # key that would invalidate on every defconfig edit - restore-keys
      # falls back to the most recent prior entry regardless of exact
      # key, so iterating on the defconfig (which this repo is actively
      # doing right now) doesn't force WPEWebKit to rebuild from zero
      # every single time. Buildroot's own per-package stamp/hash
      # tracking is what decides whether a changed config actually
      # requires rebuilding a given package - this cache only needs to
      # preserve enough prior state for Buildroot to make that call
      # itself, not to be exactly right about what changed.
      - name: Cache Buildroot build state
        uses: actions/cache@v5
        with:
          path: |
            output/host
            output/build
            output/target
            output/staging
          key: ${{ runner.os }}-buildroot-build-${{ steps.buildroot.outputs.version }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-buildroot-build-${{ steps.buildroot.outputs.version }}-

      - name: Install host dependencies
        run: ./scripts/ci-install-deps.sh

      - name: Bootstrap Buildroot
        run: ./scripts/bootstrap-buildroot.sh

      - name: Build image
        run: ./scripts/build.sh

      - name: Package test artifacts
        run: ./scripts/package-artifacts.sh

      - name: QEMU smoke test
        run: ./scripts/qemu-smoke-test.sh

      - name: Upload image artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: talaria-display-os-pr-${{ github.run_number }}
          path: |
            artifacts/talaria-display-os-*.tar.gz
            artifacts/qemu-smoke.log
            artifacts/qemu-screenshot.png
          compression-level: 0
          retention-days: 7
          if-no-files-found: warn

      - name: Add QEMU screenshot to job summary
        if: always()
        shell: bash
        run: |
          screenshot="artifacts/qemu-screenshot.png"
          if [[ ! -s "$screenshot" ]]; then
            echo "No QEMU screenshot was captured for this run." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### QEMU boot screenshot"
            echo
            echo "![QEMU boot screenshot](data:image/png;base64,$(base64 -w0 "$screenshot"))"
          } >> "$GITHUB_STEP_SUMMARY"

      # Best-effort: the screenshot capture in qemu-smoke-test.sh hasn't
      # been verified against a real QEMU version yet (no QEMU available
      # to test it while writing this). If it never produces a file,
      # this just quietly notes that in a PR comment rather than failing
      # the build over it - the smoke test's pass/fail is what gates the
      # actual job status.
      - name: Comment QEMU screenshot on PR
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          pr_number="${{ github.event.pull_request.number }}"
          screenshot="artifacts/qemu-screenshot.png"

          if [[ ! -s "$screenshot" ]]; then
            gh pr comment "$pr_number" --body "QEMU smoke test ran for this build (run #${{ github.run_number }}) but no screenshot was captured - see the workflow run for serial console logs."
            exit 0
          fi

          b64="$(base64 -w0 "$screenshot")"
          if [[ "${#b64}" -gt 60000 ]]; then
            gh pr comment "$pr_number" --body "QEMU smoke test screenshot captured for run #${{ github.run_number }}, but too large to inline in a comment - download it from the workflow run's artifact instead."
            exit 0
          fi

          body="### QEMU boot screenshot (run #${{ github.run_number }})

          ![QEMU boot screenshot](data:image/png;base64,$b64)

          Full serial console log and the downloadable image are in this run's workflow artifact."
          gh pr comment "$pr_number" --body "$body"
