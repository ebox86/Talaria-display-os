set default="0"
set timeout="3"

# vga=791 (0x317, 1024x768x64k) asks the BIOS VESA BIOS Extensions for a
# linear framebuffer mode before handing off to the kernel, which
# CONFIG_FB_VESA / CONFIG_DRM_SIMPLEDRM (see linux-video.fragment) can
# then expose as a usable framebuffer/DRM device even on hardware with
# no chipset-specific driver at all. Mode 791 is a common, old,
# widely-supported VBE mode, but VBE BIOS behavior genuinely varies
# across ~2004-2014-era hardware — record what each machine actually
# does with it in docs/hardware-inventory.md, and be ready to override
# per-machine if a particular BIOS doesn't like this mode.
#
# net.ifnames=0: without it, eudev's predictable-network-interface-name
# rule renames the NIC away from the kernel's own eth0/eth1 enumeration
# (e.g. to enp0s1) before BR2_SYSTEM_DHCP="eth0" and this rootfs's own
# scripts ever see it - the interface exists and has a working driver,
# it just isn't named what everything here assumes. Found via a real
# VM boot: e1000 bound fine, then "Waiting for interface eth0 to
# appear" timed out forever because udev had already renamed it to
# enp0s1. This is standard upstream udev/eudev behavior, not something
# specific to this image - net.ifnames=0 is the standard way to opt out
# of it project-wide, everywhere, rather than teaching every script
# here about renamed interface names.
menuentry "Talaria Display OS" {
	linux /boot/bzImage root=/dev/sda1 rootwait console=tty1 console=ttyS0,115200n8 vga=791 net.ifnames=0
}
