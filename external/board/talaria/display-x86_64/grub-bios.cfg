set default="0"
set timeout="3"

# vga=791 (0x317, 1024x768x64k) asks the BIOS VESA BIOS Extensions for a
# linear framebuffer mode before handing off to the kernel, which
# CONFIG_FB_VESA / CONFIG_DRM_SIMPLEDRM (see linux-video.fragment) can
# then expose as a usable framebuffer/DRM device even on hardware with
# no chipset-specific driver at all. Mode 791 is a common, old,
# widely-supported VBE mode, but VBE BIOS behavior genuinely varies
# across ~2004-2014-era hardware - record what each machine actually
# does with it in docs/hardware-inventory.md, and be ready to override
# per-machine if a particular BIOS doesn't like this mode.
#
# net.ifnames=0 keeps NIC names simple when firmware/kernel enumeration
# allows it, but the runtime network script no longer depends on eth0:
# it discovers the first non-loopback interface and starts DHCP there.
# Keep this parameter as a compatibility preference, not as a hard
# dependency for boot-time networking.
menuentry "Talaria Display OS" {
	linux /boot/bzImage root=/dev/sda1 rootwait console=tty1 console=ttyS0,115200n8 vga=791 net.ifnames=0
}
