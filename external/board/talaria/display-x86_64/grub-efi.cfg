set default="0"
set timeout="3"

# No vga= here (that's the BIOS/VESA path - see grub-bios.cfg). Under
# UEFI, firmware sets the GOP framebuffer mode before the kernel ever
# runs, and CONFIG_DRM_SIMPLEDRM (see linux-video.fragment) consumes
# whatever mode that was via the generic sysfb/EFI framebuffer path -
# there's no BIOS VBE call to make, so a vga= parameter here would do
# nothing.
#
# root=PARTUUID=UUID_TMP, not a fixed /dev/sdaN like grub-bios.cfg: the
# literal string UUID_TMP is substituted with the real generated root
# partition's UUID by post-image-efi.sh after genimage runs (verified
# against Buildroot's own board/pc/{grub-efi.cfg,post-image-efi.sh}
# reference for this exact mechanism). PARTUUID is also just more
# robust here than a fixed device path given real UEFI hardware in the
# wild is more likely to vary in disk controller/naming than the
# BIOS-era fleet this project started with.
menuentry "Talaria Display OS" {
	linux /bzImage root=PARTUUID=UUID_TMP rootwait console=tty1 console=ttyS0,115200n8
}
