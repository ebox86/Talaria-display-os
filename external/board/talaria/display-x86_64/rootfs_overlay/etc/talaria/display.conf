# Talaria Display OS runtime configuration.
#
# This file is the baked-in default. Production images should load the
# writable override from /data/talaria/display.conf when present.

TALARIA_SERVER_HOST=talaria.local
TALARIA_DISPLAY_MODE=dashboard
TALARIA_DISPLAY_URL=http://talaria.local:5173/dashboard/
TALARIA_DEVICE_ID=unconfigured
