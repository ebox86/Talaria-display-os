  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: linear-gradient(180deg, #3B1580 0%, #2E1065 38%, #150829 72%, #07030F 100%);
    color: #FFFFFF;
    font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    cursor: none; overflow: hidden;
    display: grid; grid-template-rows: auto 1fr auto;
    padding: 4.2vh 5vw;
  }
  .ident { display: flex; align-items: center; gap: 1.4vw; }
  .ident .word { font-family: 'Mesmerize', ui-sans-serif, sans-serif; font-weight: 800; font-size: 2.6vh; letter-spacing: 0.08em; line-height: 1; }
  .pulse { animation: breathe 2.6s ease-in-out infinite; }
  @keyframes breathe { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
  @media (prefers-reduced-motion: reduce) { .pulse, .dot { animation: none; } }

  main { display: flex; align-items: center; justify-content: center; gap: 5.5vw; }
  .hero { display: flex; flex-direction: column; align-items: flex-start; gap: 2.2vh; text-align: left; }
  .eyebrow { font-size: 2.6vh; font-weight: 500; letter-spacing: 0.03em; color: #C4B5FD; }
  .code {
    font-family: 'Mesmerize', ui-monospace, monospace; font-weight: 800;
    font-size: 14.5vh; line-height: 1; letter-spacing: 0.06em;
    color: #FFFFFF; text-shadow: 0 0 6vh rgba(167, 139, 250, 0.34);
  }
  .subtitle { font-size: 2.4vh; line-height: 1.45; color: #C4B5FD; max-width: 34ch; text-wrap: pretty; }
  .statusline { display: flex; align-items: center; gap: 1.4vw; flex-wrap: wrap; }
  .status {
    display: inline-flex; align-items: center; gap: 1.1vh;
    padding: 1.1vh 2.4vh; border-radius: 100px;
    background: rgba(167, 139, 250, 0.12); border: 1px solid rgba(167, 139, 250, 0.32);
    font-size: 1.9vh; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: #DDD3FF;
  }
  .dot { width: 1.1vh; height: 1.1vh; border-radius: 50%; background: #F97316; animation: breathe 2.6s ease-in-out infinite; }
  .expiry { font-size: 1.9vh; color: #8A6FC4; font-variant-numeric: tabular-nums; }
  .expiry[hidden] { display: none; }

  /* QR sits on white — the quiet zone and full contrast are what make it scan */
  .qr { display: flex; flex-direction: column; align-items: center; gap: 1.8vh; flex: none; }
  .qr[hidden] { display: none; }
  .qrcard { width: 34vh; height: 34vh; background: #FFFFFF; border-radius: 2.4vh; padding: 2.2vh; box-shadow: 0 2vh 6vh rgba(7, 3, 15, 0.45); }
  .qrcard svg, .qrcard img { display: block; width: 100%; height: 100%; }
  .qrcap { font-size: 1.9vh; line-height: 1.4; color: #C4B5FD; max-width: 30ch; text-align: center; text-wrap: pretty; }

  .meta { display: flex; gap: 6vw; justify-content: center; align-items: flex-start; padding-top: 1vh; }
  .group { display: flex; flex-direction: column; gap: 1.2vh; min-width: 30vw; text-align: left; }
  .group h2 { font-size: 1.7vh; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; color: #8A6FC4; }
  .row { display: grid; grid-template-columns: 15vw 1fr; gap: 1.4vw; font-size: 1.9vh; line-height: 1.45; }
  .row dt { color: #9C8CC4; }
  .row dd { color: #FFFFFF; font-variant-numeric: tabular-nums; word-break: break-all; }
  .row[hidden] { display: none; }

  footer { display: flex; align-items: flex-end; justify-content: space-between; gap: 4vw; font-size: 2vh; line-height: 1.5; color: #8A6FC4; padding-top: 3vh; }
  footer .right { text-align: right; }
  footer b { color: #A78BFA; font-weight: 600; }

  /* narrow / portrait panels: QR moves below the code */
  @media (max-aspect-ratio: 4/3) {
    main { flex-direction: column; gap: 3.4vh; }
    .hero { align-items: center; text-align: center; }
    .subtitle { max-width: 44ch; }
    .code { font-size: 9.5vh; }
    .qrcard { width: 26vh; height: 26vh; }
    .meta { flex-direction: column; gap: 2.4vh; align-items: center; }
    .group { min-width: 0; width: 80vw; }
    .row { grid-template-columns: 34vw 1fr; }
  }
</style>

<script>
// UTF-8 byte encoding, so non-ASCII field values survive the QR payload
qrcode.stringToBytes = function (str) {
  var out = [], bytes = new TextEncoder().encode(str);
  for (var i = 0; i < bytes.length; i++) out.push(bytes[i]);
  return out;
};

var FIELDS = {
  title: 'Pair this display',
  code: '\u2014\u2014\u2014\u2014-\u2014\u2014\u2014\u2014',
  subtitle: 'Scan with the Talaria app, or enter this code in Talaria Workbench.',
  status: 'Waiting for assignment',
  expiresLabel: 'Code refreshes in',
  expiresAt: '',            // ISO 8601; drives the local countdown
  qrCaption: '',
  qrPayload: '',            // full payload; built from fields below when empty
  qrPng: '',                // pre-generated PNG/SVG (qrencode) — wins if set
  qrScheme: 'talaria://display/pair',
  qrWebFallback: '',        // e.g. https://workbench.talaria.app/display/pair
  nonce: '',
  deviceHeading: 'Device',
  deviceId: '', network: '', ip: '', hardwareTier: '', displayMode: 'Pairing',
  controlHeading: 'Control Plane',
  server: '', poll: '', lastCheck: '', assignmentSource: '', deviceToken: '',
  version: '', build: '',
  help: 'This screen updates automatically when the device is claimed.',
  recovery: 'Network and browser diagnostics are available from the local console.'
};

var lastPayload = null, expiryTimer = null;

// Never put a durable credential in a QR. The payload carries a short-lived
// pairing code + nonce; the backend exchanges it for a device credential only
// after the user authenticates and picks a tenant.
var FORBIDDEN_IN_QR = ['deviceToken', 'token', 'secret', 'apiKey', 'refreshToken'];

function buildPayload() {
  if (FIELDS.qrPayload) return FIELDS.qrPayload;
  var base = FIELDS.qrWebFallback || FIELDS.qrScheme;
  var p = new URLSearchParams();
  if (FIELDS.deviceId) p.set('deviceId', FIELDS.deviceId);
  if (FIELDS.code) p.set('pairingCode', FIELDS.code);
  if (FIELDS.server) p.set('server', FIELDS.server);
  if (FIELDS.version) p.set('osVersion', FIELDS.version);
  if (FIELDS.build) p.set('build', FIELDS.build);
  if (FIELDS.nonce) p.set('nonce', FIELDS.nonce);
  if (FIELDS.expiresAt) p.set('expiresAt', FIELDS.expiresAt);
  return base + (base.indexOf('?') === -1 ? '?' : '&') + p.toString();
}

function renderQR() {
  var box = document.getElementById('qrcard');
  var wrap = document.getElementById('qr');
  var payload = buildPayload();

  var leak = FORBIDDEN_IN_QR.filter(function (k) {
    return FIELDS[k] && payload.indexOf(FIELDS[k]) !== -1;
  });
  if (leak.length) {
    console.error('[talaria] refusing to encode credential field(s) in QR: ' + leak.join(', '));
    wrap.hidden = true;
    return;
  }

  // no code yet (still resolving) → no QR, rather than a QR of nothing
  if (!FIELDS.code || /^[\u2014-]+$/.test(FIELDS.code)) { wrap.hidden = true; return; }
  wrap.hidden = false;
  if (payload === lastPayload) return;
  lastPayload = payload;

  if (FIELDS.qrPng) { box.innerHTML = '<img alt="Pairing QR code" src="' + FIELDS.qrPng + '">'; return; }
  try {
    var qr = qrcode(0, 'Q');   // level Q: survives a phone photo at an angle
    qr.addData(payload);
    qr.make();
    box.innerHTML = qr.createSvgTag({ cellSize: 1, margin: 1, scalable: true, alt: 'Pairing QR code' });
  } catch (e) {
    console.error('[talaria] QR render failed', e);
    wrap.hidden = true;
  }
}

function pad(n) { return (n < 10 ? '0' : '') + n; }

function tickExpiry() {
  var box = document.getElementById('expiry');
  var out = document.getElementById('expiresIn');
  if (!FIELDS.expiresAt) { box.hidden = true; return; }
  var ms = new Date(FIELDS.expiresAt).getTime() - Date.now();
  if (isNaN(ms)) { box.hidden = true; return; }
  box.hidden = false;
  if (ms <= 0) { out.textContent = '\u2014 refreshing'; return; }
  var t = Math.floor(ms / 1000);
  out.textContent = pad(Math.floor(t / 60)) + ':' + pad(t % 60);
}

function apply(patch) {
  for (var k in patch) if (patch[k] !== null && patch[k] !== undefined) FIELDS[k] = String(patch[k]);
  var nodes = document.querySelectorAll('[data-field]');
  for (var i = 0; i < nodes.length; i++) {
    var key = nodes[i].getAttribute('data-field');
    if (key in FIELDS) nodes[i].textContent = FIELDS[key];
  }
  var rows = document.querySelectorAll('[data-row]');
  for (var j = 0; j < rows.length; j++) {
    var rk = rows[j].getAttribute('data-row');
    rows[j].hidden = !FIELDS[rk];
  }
  renderQR();
  tickExpiry();
  if (!expiryTimer) expiryTimer = setInterval(tickExpiry, 1000);
  document.title = 'Talaria \u2014 ' + FIELDS.title;
}

function fromQuery() { var o = {}, q = new URLSearchParams(location.search); q.forEach(function (v, k) { o[k] = v; }); return o; }

function load() {
  return fetch('pairing.json', { cache: 'no-store' })
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (j) { if (j) apply(Object.assign({}, j, fromQuery())); })
    .catch(function () {});
}

apply(fromQuery());
load();

// Poll on the assignment cadence. A rotated pairing code arrives here and is
// applied in place — the QR re-renders, the countdown resets, no page reload.
function pollMs() { var n = parseInt(FIELDS.poll, 10); return (n > 0 ? n : 15) * 1000; }
setInterval(load, pollMs());

window.addEventListener('message', function (e) {
  if (e.data && e.data.type === 'talaria:pairing' && e.data.fields) apply(e.data.fields);
});
</script>
