  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: linear-gradient(180deg, #3B1580 0%, #2E1065 38%, #150829 72%, #07030F 100%);
    color: #FFFFFF; font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased; display: flex; align-items: center; justify-content: center;
    cursor: none; overflow: hidden;
  }
  .stage { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 3.2vh; padding: 6vh 8vw; }
  .word { font-family: 'Mesmerize', ui-sans-serif, sans-serif; font-weight: 800; font-size: 5.4vh; letter-spacing: 0.07em; line-height: 1; }
  .rule { width: 12vh; height: 3px; border-radius: 2px; background: #F97316; opacity: 0.9; }
  h1 { font-size: 4.2vh; font-weight: 600; letter-spacing: -0.01em; line-height: 1.15; }
  p { font-size: 2.4vh; line-height: 1.5; color: #C4B5FD; max-width: 46ch; text-wrap: pretty; }
  .code { font-size: 2.2vh; letter-spacing: 0.22em; text-transform: uppercase; color: #F97316; font-weight: 600; }
  .code:empty, .retry[hidden] { display: none; }
  .meta { position: fixed; left: 3.4vw; bottom: 3.4vh; display: flex; gap: 2.2vw; font-size: 1.9vh; letter-spacing: 0.16em; text-transform: uppercase; color: #8A6FC4; }
  .meta b { color: #A78BFA; font-weight: 600; }
  .retry { position: fixed; right: 3.4vw; bottom: 3.4vh; font-size: 1.9vh; letter-spacing: 0.16em; text-transform: uppercase; color: #8A6FC4; }
  .pulse { animation: breathe 2.6s ease-in-out infinite; }
  @keyframes breathe { 0%, 100% { opacity: 1; } 50% { opacity: 0.28; } }
  @media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }
</style>
</head>
<body>
  <div class="stage">
    <svg width="200" height="200" viewBox="0 0 120 120" fill="none" aria-hidden="true">
      <g transform="rotate(-16 60 60)" stroke-linecap="round" stroke-width="14">
        <path d="M18 40H98" stroke="#FFFFFF"/>
        <path class="pulse" d="M30 66H86" stroke="#F97316"/>
        <path d="M48 92H74" stroke="#A78BFA"/>
      </g>
    </svg>
    <div class="word">TALARIA</div>
    <div class="rule"></div>
    <h1 data-field="heading"></h1>
    <p data-field="body"></p>
    <div class="code" data-field="code"></div>
  </div>
  <div class="meta"><span>Display <b data-field="deviceId"></b></span><span data-field="state"></span></div>
  <div class="retry" id="retry">Retrying in <span id="t"></span>s</div>
<script>
// Same field model as pairing.html: defaults here, overridden by fallback.json,
// the query string, or a postMessage from the supervisor. Nothing is baked in.
var FIELDS = {
  heading: "Waiting for the content service",
  body: "This display has lost its connection. It will resume on its own as soon as the network returns — no action needed.",
  code: "",
  state: "Offline",
  deviceId: '',
  retry: 15
};
var timer = null;
function apply(patch) {
  for (var k in patch) if (patch[k] !== null && patch[k] !== undefined) FIELDS[k] = patch[k];
  var n = document.querySelectorAll('[data-field]');
  for (var i = 0; i < n.length; i++) {
    var key = n[i].getAttribute('data-field');
    if (key in FIELDS) n[i].textContent = String(FIELDS[key]);
  }
  if (!FIELDS.deviceId) {
    var q = new URLSearchParams(location.search);
    document.querySelector('[data-field="deviceId"]').textContent = q.get('id') || location.hostname || 'local';
  }
  var secs = parseInt(FIELDS.retry, 10) || 0;
  var box = document.getElementById('retry');
  box.hidden = secs <= 0;
  if (timer) { clearInterval(timer); timer = null; }
  if (secs > 0) {
    var el = document.getElementById('t');
    el.textContent = secs;
    timer = setInterval(function () { secs--; el.textContent = secs > 0 ? secs : 0; if (secs <= 0) location.reload(); }, 1000);
  }
}
function fromQuery() { var o = {}, q = new URLSearchParams(location.search); q.forEach(function (v, k) { o[k] = v; }); return o; }
apply(fromQuery());
fetch('fallback.json', { cache: 'no-store' })
  .then(function (r) { return r.ok ? r.json() : null; })
  .then(function (j) { if (j) apply(Object.assign({}, j["offline"] || {}, fromQuery())); })
  .catch(function () {});
window.addEventListener('message', function (e) {
  if (e.data && e.data.type === 'talaria:fallback' && e.data.fields) apply(e.data.fields);
});
</script>
