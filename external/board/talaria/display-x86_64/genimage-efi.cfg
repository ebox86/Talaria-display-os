# Hybrid-fleet UEFI variant of genimage-bios.cfg, for newer PCs that
# have dropped CSM/legacy-BIOS boot entirely. Layout verified against
# Buildroot's own board/pc/genimage-efi.cfg reference for this pinned
# version (2026.05.1), not guessed - same GPT partition-type-uuid
# shorthands ('U' = EFI System Partition, 'L' = generic Linux
# filesystem) and the same UUID_TMP placeholder convention that
# post-image-efi.sh substitutes with the real generated root UUID.
#
# The kernel (bzImage) lives directly on the ESP next to grub, not
# inside the ext2 root partition like the BIOS variant's /boot/bzImage
# - that's the reference's own layout, kept as-is rather than
# diverging from a verified-working pattern: it lets grub-efi.cfg load
# it as plain /bzImage without needing to locate the root partition
# first.
image efi-part.vfat {
	vfat {
		file EFI {
			image = "efi-part/EFI"
		}

		file bzImage {
			image = "bzImage"
		}
	}

	size = 16352K # 16MB - 32KB, same headroom as the upstream reference
}

image data.ext4 {
	ext4 {
		label = "TALARIA_DATA"
	}
	size = 64M
}

image disk.img {
	hdimage {
		partition-table-type = "gpt"
	}

	partition boot {
		image = "efi-part.vfat"
		partition-type-uuid = U
		offset = 32K
		bootable = true
	}

	partition root {
		partition-type-uuid = L
		partition-uuid = UUID_TMP
		image = "rootfs.ext2"
	}

	# Discovered by filesystem label (/dev/disk/by-label/TALARIA_DATA in
	# S20talaria-data), not by device path, so this partition needs no
	# UUID substitution and no changes versus the BIOS variant's data
	# partition at all.
	partition data {
		partition-type-uuid = L
		image = "data.ext4"
	}
}
